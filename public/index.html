<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="甘肃奶龙大学，GO！" />
    <meta
      name="theme-color"
      content="#fdfaf3"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#17130d"
      media="(prefers-color-scheme: dark)"
    />
    <title>甘肃奶龙大学</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/logo.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link
      rel="stylesheet"
      href="https://cdn.amoe.cc/web-static/public/font/misans/misans.css"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/motion.js"></script>
    <script
      defer
      src="https://umami.amoe.cc/script.js"
      data-website-id="ee3cbb93-6ca4-4164-8a6c-4bb22b80675d"
    ></script>
  </head>
  <body>
    <div class="scene">
      <div class="ambient" aria-hidden="true"></div>
      <div class="orbits" aria-hidden="true">
        <div class="orbit orbit-a">
          <span class="satellite satellite-gold"></span>
        </div>
        <div class="orbit orbit-b">
          <span class="satellite satellite-star">
            <svg
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"
              />
            </svg>
          </span>
        </div>
        <div class="orbit orbit-c">
          <span class="satellite satellite-blue"></span
          ><span class="satellite satellite-small"></span>
        </div>
      </div>
      <div class="grain" aria-hidden="true"></div>
      <main>
        <div class="entry">
          <div class="logo-wrap">
            <img
              class="logo"
              src="/logo.png"
              width="104"
              height="104"
              alt="奶龙校徽"
            />
          </div>
          <div class="sticker-wrap" aria-hidden="true">
            <span class="sticker"
              >奶龙出没
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="m10 4 2 6 6 2-6 2-2 6-2-6-6-2 6-2ZM19 2v4m-2-2h4m-1 12v4m-2-2h4"
                /></svg
            ></span>
          </div>
          <span class="star star-a" aria-hidden="true"
            ><svg
              width="27"
              height="27"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"
              /></svg
          ></span>
          <h1>
            甘肃奶龙大学<span class="title-dot" aria-hidden="true">.</span>
          </h1>
          <div class="go-wrap">
            <a
              class="go"
              href="https://www.lut.edu.cn"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GO，前往兰州理工大学官网（新窗口打开）"
            >
              <span>GO</span>
              <svg
                class="go-arrow"
                width="48"
                height="48"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M7 7h10v10M7 17 17 7" />
              </svg>
            </a>
          </div>
          <span class="scribble" aria-hidden="true">LET’S GO!</span>
          <span class="star star-b" aria-hidden="true"
            ><svg
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"
              /></svg
          ></span>
        </div>
      </main>
      <footer>
        <nav class="footer-links" aria-label="相关链接">
          <span class="footer-source">
            <a
              class="version"
              href="https://github.com/TomyJan/gansunailongdaxue.com/commit/__COMMIT_SHA__"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="查看提交 __COMMIT_SHORT__（新窗口打开）"
              >__COMMIT_SHORT__</a
            >
            <a
              href="https://github.com/TomyJan/gansunailongdaxue.com"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub 仓库（新窗口打开）"
              >GitHub</a
            >
            <span class="footer-divider" aria-hidden="true">|</span>
          </span>
          <a
            href="https://nai.amoe.cc"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="查找更多奶群和奶站（新窗口打开）"
            >查找更多奶群和奶站</a
          >
        </nav>
        <button class="motion-toggle" type="button" aria-pressed="false" hidden>
          <svg
            class="pause-icon"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M9 5v14M15 5v14" />
          </svg>
          <svg
            class="play-icon"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m8 4 12 8-12 8Z" />
          </svg>
          <span>暂停动效</span>
        </button>
      </footer>
      <div class="exit-wipe" aria-hidden="true"></div>
    </div>
  </body>
</html>
